<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pengurus masjid dan petugas Amanah Energi berjabat tangan di depan masjid">
